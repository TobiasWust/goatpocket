<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>GoatPocket</title>
  <meta name="description" content="Mobiles Dashboard für GoatCounter">
  <meta name="theme-color" content="#f6f4ef" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#121211" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="GoatPocket">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="referrer" content="no-referrer">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app"></div>
  <div id="sheet" class="sheet" hidden>
    <div class="sheet-backdrop" data-close></div>
    <div class="sheet-panel" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
      <div class="sheet-grip" data-close></div>
      <div class="sheet-head">
        <div>
          <div class="sheet-kicker" id="sheet-kicker"></div>
          <h2 id="sheet-title"></h2>
        </div>
        <button class="icon-btn" data-close aria-label="Schließen">✕</button>
      </div>
      <div class="sheet-body" id="sheet-body"></div>
    </div>
  </div>
  <script src="app.js" type="module"></script>
</body>
</html>
