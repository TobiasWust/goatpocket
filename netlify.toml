# Netlify deploys the repository root as-is; there is no build step.
[build]
  publish = "."
  command = ""

[[headers]]
  for = "/*"
  [headers.values]
    # Scripts only from this origin, plus GoatCounter's count.js for the website's visitor
    # count (sent to goatpocket.goatcounter.com). API calls may go to any HTTPS host, because
    # GoatCounter can be self-hosted on any domain. Inline styles are needed for the
    # bar widths, which are set as CSS custom properties.
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://gc.zgo.at; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://goatpocket.goatcounter.com; connect-src 'self' https:; manifest-src 'self'; worker-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; object-src 'none'"
    Referrer-Policy = "no-referrer"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/app/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/app/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

# On app.goatpocket.com the manifest is requested at the root path.
[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

# The website is served at goatpocket.com, the app at app.goatpocket.com. Both come from
# this one Netlify site: requests to the app domain are rewritten to the /app/ folder.
# All domains below must be set as domains of the Netlify site for these rules to answer.

# App domain: the shared icons live outside /app/, everything else inside it.
[[redirects]]
  from = "https://app.goatpocket.com/icons/*"
  to = "/icons/:splat"
  status = 200
  force = true

[[redirects]]
  from = "https://app.goatpocket.com/*"
  to = "/app/:splat"
  status = 200
  force = true

# Old app addresses now point to the app domain.
[[redirects]]
  from = "https://goatpocket.com/app/*"
  to = "https://app.goatpocket.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://goatpocket.wust.io/*"
  to = "https://app.goatpocket.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.goatpocket.com/*"
  to = "https://goatpocket.com/:splat"
  status = 301
  force = true

# Development and repository files are not part of the site.
[[redirects]]
  from = "/node_modules/*"
  to = "/404"
  status = 404
  force = true
