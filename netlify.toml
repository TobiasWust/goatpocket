# Netlify deploys the repository root as-is; there is no build step.
[build]
  publish = "."
  command = ""

[[headers]]
  for = "/*"
  [headers.values]
    # Scripts only from this origin. API calls may go to any HTTPS host, because
    # GoatCounter can be self-hosted on any domain. Inline styles are needed for the
    # bar widths, which are set as CSS custom properties.
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https:; manifest-src 'self'; worker-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; object-src 'none'"
    Referrer-Policy = "no-referrer"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

[[headers]]
  for = "/app/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

# Domains (all on this one Netlify site):
#   goatpocket.com       landing page (primary domain)
#   app.goatpocket.com   the app, served from /app/
#   www.goatpocket.com, goatpocket.wust.io   aliases that redirect
# Netlify uses the first matching rule.

# Old domain: the app moved to the subdomain, everything else to the new domain.
[[redirects]]
  from = "https://goatpocket.wust.io/app/*"
  to = "https://app.goatpocket.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://goatpocket.wust.io/*"
  to = "https://goatpocket.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.goatpocket.com/*"
  to = "https://goatpocket.com/:splat"
  status = 301
  force = true

# goatpocket.com/app/ → app.goatpocket.com (the landing page links to app/ relatively,
# so it also works locally and when self-hosted).
[[redirects]]
  from = "https://goatpocket.com/app/*"
  to = "https://app.goatpocket.com/:splat"
  status = 301
  force = true

# app.goatpocket.com: serve /app/ at the root. "/" must be forced because the landing
# page's index.html exists there too. Everything else is a fallback (not forced), so
# shared files at the site root – /icons/, /sw.js, /legal.html – are still served.
[[redirects]]
  from = "https://app.goatpocket.com/"
  to = "/app/index.html"
  status = 200
  force = true

[[redirects]]
  from = "https://app.goatpocket.com/index.html"
  to = "/app/index.html"
  status = 200
  force = true

[[redirects]]
  from = "https://app.goatpocket.com/*"
  to = "/app/:splat"
  status = 200

# Development and repository files are not part of the site.
[[redirects]]
  from = "/node_modules/*"
  to = "/404"
  status = 404
  force = true
