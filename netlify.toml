[build]
  publish = "."

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

[[headers]]
  for = "/*"
  [headers.values]
    Referrer-Policy = "no-referrer"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

# Alte Adresse auf die neue Domain umleiten
[[redirects]]
  from = "https://goatpocket.wust.io/*"
  to = "https://goatpocket.com/:splat"
  status = 301
  force = true
